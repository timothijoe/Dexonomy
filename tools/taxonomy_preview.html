<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dexonomy 3D 抓取浏览器</title>
  <style>
    :root{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:#172033;--blue:#2463eb;--line:#dfe4ec;--muted:#6b7485;--soft:#f4f6f9;--shadow:0 18px 55px rgba(23,32,51,.14)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:#e6e9ee}button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:66px minmax(0,1fr)}
    .topbar{z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.94);border-bottom:1px solid #d7dce4;backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#3478ff,#1746a8);font-weight:800;box-shadow:0 8px 18px rgba(36,99,235,.28)}
    .brand-title{font-weight:780;letter-spacing:-.025em}.brand-subtitle{margin-top:2px;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}
    .status{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:#a4acb8}.status.ready .status-dot{background:#25a66f;box-shadow:0 0 0 4px rgba(37,166,111,.12)}.status.error .status-dot{background:#d83e45}.top-button{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
    .workspace{min-height:0;display:grid;grid-template-columns:280px minmax(430px,1fr) 320px;gap:1px;background:#d9dee6}.sidebar,.inspector{min-height:0;overflow:auto;background:rgba(255,255,255,.96)}.sidebar{padding:22px 18px}.inspector{padding:22px}
    .kicker{color:#8a94a4;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.section-title{margin:6px 0 17px;font-size:19px;letter-spacing:-.03em}.class-list,.sample-list{display:grid;gap:8px}.class-list{margin-bottom:22px}
    .class-button{width:100%;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;padding:11px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;cursor:pointer}.class-button:hover{background:var(--soft)}.class-button.active{color:#1647b2;background:#eaf1ff;border-color:#ccdcff}
    .class-number{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#edf0f4;color:#647083;font-size:12px;font-weight:780}.class-button.active .class-number{color:#fff;background:var(--blue)}.class-name{font-size:13px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}.class-count{color:#8a94a4;font-size:11px}
    .sample-heading{display:flex;justify-content:space-between;margin:0 2px 9px;font-size:12px}.sample-heading span{color:#8a94a4}.sample-button{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;cursor:pointer}.sample-button:hover{border-color:#b8c5dc}.sample-button.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,99,235,.1)}.sample-label{font-size:13px;font-weight:730}.sample-object{margin-top:4px;overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
    .stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#e9ebef}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,#fff 0,#f7f8fa 34%,#dce1e8 100%)}.stage:after{content:"";position:absolute;z-index:0;left:50%;bottom:10%;width:45%;height:9%;transform:translateX(-50%);border-radius:50%;background:rgba(34,45,62,.11);filter:blur(22px)}
    .poster{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain;padding:92px 7% 112px;opacity:1;transition:opacity .25s;background:transparent}.poster.hidden{opacity:0;pointer-events:none}model-viewer{visibility:hidden;pointer-events:none;position:absolute;z-index:2;inset:0;width:100%;height:100%;background:transparent;--progress-bar-color:var(--blue)}.stage.three-d model-viewer{visibility:visible;pointer-events:auto}.viewer-mode{position:absolute;z-index:7;right:22px;bottom:27px;padding:10px 14px;border:1px solid #c9d0db;border-radius:10px;background:rgba(255,255,255,.94);box-shadow:0 8px 20px rgba(23,32,51,.1);font-size:12px;font-weight:730;cursor:pointer}.viewer-mode:hover{color:var(--blue);border-color:#aac0ed}.stage-note{position:absolute;z-index:7;left:50%;bottom:88px;display:none;max-width:min(520px,80%);padding:8px 12px;transform:translateX(-50%);border:1px solid #e8d7a4;border-radius:9px;background:rgba(255,250,230,.95);color:#715e22;font-size:11px;text-align:center}.stage-note.visible{display:block}.viewer-title{position:absolute;z-index:4;top:27px;left:30px;pointer-events:none}.viewer-title h1{margin:6px 0 0;font-size:clamp(26px,3vw,40px);letter-spacing:-.05em}.viewer-title p{margin:8px 0 0;color:var(--muted);font-size:12px}
    .tools{position:absolute;z-index:5;top:22px;right:22px;display:grid;gap:8px}.tool-button{width:41px;height:41px;border:1px solid rgba(201,208,219,.95);border-radius:11px;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(23,32,51,.08);cursor:pointer}.tool-button:hover{color:var(--blue);border-color:#b6c9f2}
    .phase-bar{position:absolute;z-index:6;left:50%;bottom:27px;display:flex;align-items:center;gap:5px;padding:6px;transform:translateX(-50%);border:1px solid rgba(201,208,219,.92);border-radius:15px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.phase-button{min-width:102px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#667184;font-size:12px;font-weight:730;cursor:pointer}.phase-button:hover{background:#f0f3f7}.phase-button.active{color:#fff;background:#172033;box-shadow:0 5px 13px rgba(23,32,51,.2)}.phase-button small{display:block;margin-top:2px;opacity:.65;font-size:9px}.play-button{width:38px;height:38px;margin-left:2px;border:0;border-radius:10px;color:#fff;background:var(--blue);box-shadow:0 5px 12px rgba(36,99,235,.25);cursor:pointer}
    .load-state{position:absolute;z-index:8;inset:0;display:grid;place-items:center;visibility:hidden;opacity:0;background:rgba(235,238,242,.5);transition:.18s;pointer-events:none;backdrop-filter:blur(2px)}.load-state.visible{visibility:visible;opacity:1}.load-card{min-width:230px;padding:22px;border:1px solid #d4dae3;border-radius:15px;background:rgba(255,255,255,.96);text-align:center;box-shadow:var(--shadow)}.spinner{width:29px;height:29px;margin:0 auto 12px;border:3px solid #dce5f6;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.load-label{font-size:13px;font-weight:730}.load-detail{margin-top:5px;color:var(--muted);font-size:11px}
    .error-state{position:absolute;z-index:9;top:50%;left:50%;display:none;width:min(430px,calc(100% - 48px));padding:23px;transform:translate(-50%,-50%);border:1px solid #efc0c3;border-radius:15px;background:rgba(255,248,248,.97);box-shadow:var(--shadow)}.error-state.visible{display:block}.error-title{color:#a72a31;font-weight:780}.error-detail{margin-top:8px;color:#7c5558;font-size:12px;line-height:1.55;overflow-wrap:anywhere}.retry-button{margin-top:14px;padding:9px 13px;border:0;border-radius:9px;color:#fff;background:#b6333a;cursor:pointer}
    .info-header{padding-bottom:18px;border-bottom:1px solid var(--line)}.badge{display:inline-flex;padding:5px 8px;border-radius:7px;color:#1647b2;background:#eaf1ff;font-size:10px;font-weight:800}.info-title{margin:12px 0 5px;font-size:23px;line-height:1.15;letter-spacing:-.04em;overflow-wrap:anywhere}.info-subtitle{color:var(--muted);font-size:11px}.info-section{padding:20px 0;border-bottom:1px solid var(--line)}.info-section:last-child{border-bottom:0}.info-section h3{margin:0 0 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.phase-description{padding:13px;border-left:3px solid var(--blue);border-radius:0 9px 9px 0;background:#eaf1ff;color:#3d4a61;font-size:12px;line-height:1.55}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:12px;border-radius:10px;background:var(--soft)}.metric-value{font-size:17px;font-weight:780}.metric-label{margin-top:3px;color:var(--muted);font-size:10px}.legend{display:grid;gap:10px}.legend-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}.legend-name{display:flex;align-items:center;gap:9px}.swatch{width:11px;height:11px;border-radius:3px}.hand{background:#2463eb}.object{background:#a5aebd}.legend-value{color:var(--muted);font-size:10px}.source-path{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fafbfc;color:#657083;font:10px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:8px 11px;color:var(--muted);font-size:11px}kbd{min-width:30px;padding:3px 6px;border:1px solid #ccd3dd;border-bottom-width:2px;border-radius:5px;background:#fff;color:#4d596c;text-align:center;font:10px ui-monospace,monospace}
    .download-model{position:absolute;z-index:7;right:22px;bottom:77px;padding:8px 12px;border:1px solid #c9d0db;border-radius:9px;background:rgba(255,255,255,.94);color:#40516f;text-decoration:none;font-size:11px;font-weight:700}.download-model:hover{color:var(--blue);border-color:#aac0ed}
    .orbit-image{display:none;position:absolute;z-index:2;inset:0;width:100%;height:100%;object-fit:contain;padding:92px 7% 112px;background:#f5f7fb;cursor:grab;touch-action:none;user-select:none}.orbit-image:active{cursor:grabbing}.stage.orbit .orbit-image{display:block}.orbit-controls{display:none;position:absolute;z-index:6;left:50%;bottom:142px;transform:translateX(-50%);align-items:center;gap:8px;padding:5px;border:1px solid #d7dce5;border-radius:10px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}.stage.orbit .orbit-controls{display:flex}.orbit-controls button{border:0;border-radius:7px;padding:6px 10px;background:#edf2fc;color:#3159a5;cursor:pointer}.orbit-controls span{min-width:42px;text-align:center;color:#546174;font-size:11px;font-weight:700}
    @media(max-width:1050px){.workspace{grid-template-columns:230px minmax(420px,1fr)}.inspector{display:none}}@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-rows:60px auto}.workspace{display:flex;flex-direction:column}.sidebar{order:2;overflow:visible}.stage{order:1;height:68vh;min-height:520px}.inspector{display:block;order:3;overflow:visible}.class-list{display:flex;overflow-x:auto}.class-button{min-width:205px}.sample-list{grid-template-columns:repeat(3,1fr)}.status{display:none}.phase-button{min-width:76px;padding:9px 8px}.phase-button small{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="mark">Dx</div><div><div class="brand-title">Dexonomy 3D 抓取浏览器</div><div class="brand-subtitle">Shadow Hand · 真实运动学姿态</div></div></div><div class="top-actions"><div class="status" id="systemStatus"><span class="status-dot"></span><span>正在初始化</span></div><button class="top-button" id="helpButton" title="操作提示">?</button></div></header>
    <main class="workspace">
      <aside class="sidebar"><div class="kicker">Taxonomy</div><h2 class="section-title">抓取类别</h2><div class="class-list" id="classList"></div><div class="sample-heading"><strong>代表样本</strong><span id="sampleCount"></span></div><div class="sample-list" id="sampleList"></div></aside>
      <section class="stage" id="stage"><div class="viewer-title"><div class="kicker" id="viewerKicker">3D specimen</div><h1 id="viewerHeading">载入中</h1><p id="viewerHint">拖动旋转 · 滚轮缩放 · 双击聚焦</p></div><img class="poster" id="poster" alt="Shadow Hand 静态抓取预览"><img class="orbit-image" id="orbitImage" alt="手与物体的预渲染环绕视角" draggable="false"><model-viewer id="viewer" camera-controls camera-orbit="135deg 70deg auto" touch-action="pan-y" shadow-intensity="1.2" shadow-softness=".8" exposure=".55" environment-image="neutral" interaction-prompt="auto" loading="eager" alt="Shadow Hand 三维抓取模型"></model-viewer><div class="tools"><button class="tool-button" id="resetCamera" title="重置相机 (R)">↻</button><button class="tool-button" id="fullscreenButton" title="全屏查看 (F)">⛶</button></div><div class="phase-bar" id="phaseBar"></div><div class="orbit-controls"><button id="orbitPrevious" title="上一视角">←</button><span id="orbitCount">1 / 12</span><button id="orbitNext" title="下一视角">→</button></div><a class="download-model" id="downloadModel" href="#" download>下载当前 GLB</a><button class="viewer-mode" id="viewerMode">切换到 3D</button><div class="stage-note" id="stageNote"></div><div class="load-state" id="loadState"><div class="load-card"><div class="spinner"></div><div class="load-label">正在载入三维模型</div><div class="load-detail" id="loadDetail">准备资源…</div></div></div><div class="error-state" id="errorState"><div class="error-title">三维模型加载失败</div><div class="error-detail" id="errorDetail"></div><button class="retry-button" id="retryButton">重新加载</button></div></section>
      <aside class="inspector"><div class="info-header"><span class="badge" id="classBadge">CLASS</span><h2 class="info-title" id="infoTitle">载入中</h2><div class="info-subtitle" id="infoSubtitle"></div></div><section class="info-section"><h3>当前阶段</h3><div class="phase-description" id="phaseDescription"></div></section><section class="info-section"><h3>样本信息</h3><div class="metric-grid"><div class="metric"><div class="metric-value" id="sampleIndex">—</div><div class="metric-label">文件内索引</div></div><div class="metric"><div class="metric-value" id="sampleTotal">—</div><div class="metric-label">文件内抓取数</div></div></div></section><section class="info-section"><h3>场景图例</h3><div class="legend"><div class="legend-row"><span class="legend-name"><i class="swatch hand"></i>Shadow Hand</span><span class="legend-value">蓝色</span></div><div class="legend-row"><span class="legend-name"><i class="swatch object"></i>被抓取物体</span><span class="legend-value">灰色</span></div></div></section><section class="info-section"><h3>数据来源</h3><div class="source-path" id="sourcePath"></div></section><section class="info-section" id="shortcutSection"><h3>快捷操作</h3><div class="shortcuts"><kbd>1–3</kbd><span>切换抓取阶段</span><kbd>← →</kbd><span>切换代表样本</span><kbd>R</kbd><span>重置观察相机</span><kbd>F</kbd><span>进入全屏模式</span></div></section></aside>
    </main>
  </div>
  <script src="app.js?v=orbit-fallback-1" defer></script>
</body>
</html>
