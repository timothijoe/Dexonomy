<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow → Wuji 一代 · 第三版旋转对照</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151e;color:#e7ecf5}*{box-sizing:border-box}body{margin:0}header,main{padding:22px 28px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#b7c4d8;margin:8px 0}a{color:#91d5ff}select,input,button{font:inherit;background:#1c2635;color:#e7ecf5;border:1px solid #42516b;border-radius:7px;padding:8px;max-width:100%;min-width:0}button{cursor:pointer}button.active{background:#285375;border-color:#80cbff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.orbit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.control{display:grid;grid-template-columns:auto auto minmax(70px,1fr) auto;gap:7px;align-items:center;background:#17202d;padding:12px;border:1px solid #344056;border-radius:8px}.control label,.control output{grid-column:1/-1}input[type=range]{width:100%;padding:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:14px 0 24px}article{min-width:0;border:1px solid #344056;border-radius:9px;overflow:hidden;background:#17202d}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;padding:12px;margin:0}.source h3{color:#f3a27d}.v2 h3{color:#a8c5f3}.selected h3{color:#85e3df}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab;background:black}canvas:active{cursor:grabbing}#loading{min-height:25px;color:#8dd9ff}#meta{overflow-wrap:anywhere}.note{font-size:13px}.rejected{color:#ffcf8e}#counts{color:#8dd9ff}.controls{padding:0 28px 16px;border-bottom:1px solid #344056}#asset{max-width:360px}#grasp{max-width:380px}
@media(max-width:950px){.orbit{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.control{grid-template-columns:auto auto minmax(100px,1fr) auto}header,main{padding:16px}.controls{padding:0 16px 16px}.toolbar select{width:100%;max-width:100%}}
</style>
<header><h1>Shadow → Wuji 一代 · 第三版旋转对照</h1><div id="counts"></div><p>同一组视角同步比较 Shadow 来源、第二版最终选用、第三版最终选用。拖动画面可调整水平和俯仰；滚转仅旋转每张画面。姿态与检查状态沿用已完成第三版。</p><a id="back" href="../index.html">返回固定九格总览</a></header>
<section class="controls"><div class="toolbar"><select id="asset" aria-label="资产"></select><select id="grasp" aria-label="握法"></select><select id="phase" aria-label="阶段"><option value="grasp">抓取</option><option value="pregrasp">预抓取</option><option value="squeeze">收紧</option><option value="all">三个阶段</option></select><button id="scene" class="active">带物体</button><button id="hand">纯手型</button><button id="reset">重置视角</button></div>
<div class="orbit"><div class="control"><label for="yawRange">水平环绕（Yaw）</label><button id="yawPrevious" aria-label="水平向左">←</button><span></span><input id="yawRange" type="range" min="0" max="11" value="0"><button id="yawNext" aria-label="水平向右">→</button><output id="yawCount"></output></div>
<div class="control"><label for="pitchRange">上下俯仰（Pitch）</label><button id="pitchPrevious" aria-label="俯仰向下">↓</button><span></span><input id="pitchRange" type="range" min="0" max="4" value="2"><button id="pitchNext" aria-label="俯仰向上">↑</button><output id="pitchCount"></output></div>
<div class="control"><label for="rollRange">画面滚转（Roll）</label><button id="rollPrevious" aria-label="逆时针滚转">↶</button><span></span><input id="rollRange" type="range" min="0" max="11" value="0"><button id="rollNext" aria-label="顺时针滚转">↷</button><output id="rollCount"></output></div></div>
<p id="meta"></p><div id="loading" role="status"></div><p class="note">水平与俯仰来自 MuJoCo 重新渲染的 12×5 视角，滚转为 30° 一档的画面旋转。无需 WebGL。通过状态是静态几何检查，不代表已经在真实控制下握住。</p></section>
<main id="panels"></main><script id="data" type="application/json">__ROTATION_DATA__</script><script src="app.js"></script></html>
